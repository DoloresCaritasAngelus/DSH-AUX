name: Feature request
description: 提出新功能或改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景 / 问题
      description: 你想解决什么问题?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你期望的行为或设计
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 其他考虑过的做法
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: 影响面
      description: 涉及补丁/设置/文档/测试哪些方面
    validations:
      required: false
