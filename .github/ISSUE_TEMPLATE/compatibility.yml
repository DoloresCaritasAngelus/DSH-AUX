name: DSH compatibility
description: 报告新 DSH 版本的兼容问题
title: "[Compatibility]: "
labels: ["compatibility"]
body:
  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本
      description: 例如 0.1.1-rc.1
    validations:
      required: true
  - type: input
    id: aux-version
    attributes:
      label: dsh-aux 版本
      description: 例如 0.3.2
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: 兼容问题
      description: 安装/升级后哪里异常?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 相关输出
    validations:
      required: false
