name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: aux 测试(零依赖)
        run: node --test tests/aux.test.js
        working-directory: tests
      - name: bridge 逻辑测试(无 agent-loop 时自动跳过)
        run: node --test bridge.test.js
        working-directory: tests
