name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 提交信息规范检查(Conventional Commits)
        run: node scripts/ci-commit-lint.mjs
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: 安装测试依赖(DSH 官方包 + devDependencies)
        run: npm install --no-package-lock --no-audit --no-fund
      - name: ESLint(recommended;0 error 门禁,warning 不阻塞)
        run: npm run lint
      - name: Prettier 格式检查
        run: npm run format:check
      - name: 全量测试(零第三方运行时依赖)
        run: node --test tests/*.test.js
      - name: 文档脱密检查
        run: node scripts/ci-doc-hygiene.mjs
      - name: README 单一真相检查
        run: node scripts/gen-package-readme.mjs --check
      - name: 全仓语法检查
        run: node scripts/ci-syntax-check.mjs
      - name: npm 发布内容断言
        run: node scripts/ci-pack-check.mjs
      - name: shell 脚本语法检查
        run: bash -n install.sh update.sh
      - name: Bridge 补丁 dry-run(当前 DSH)
        run: node scripts/ci-fake-dsh.mjs

  # 包级 DSH 版本兼容矩阵:不需要容器,直接用 npm 切换 @deepseek-ai/* 版本。
  # 当前验证支持:0.1.2-alpha.2 ~ 0.1.2-rc.1。旧版见 legacy 分支。
  # 注:0.1.2-alpha.1 只有 GitHub release,没有对应 npm 包发布,无法进入 npm 矩阵。
  # 注:alpha.4/alpha.5/rc.1 在 AUX 相关包代码一致,仍分别保留以锁定发布线。
  compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dsh-version: [0.1.2-alpha.2, 0.1.2-alpha.3, 0.1.2-alpha.4, 0.1.2-alpha.5, 0.1.2-rc.1]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
      - name: 切换到 DSH ${{ matrix.dsh-version }}
        run: node scripts/install-dsh-version.mjs --version ${{ matrix.dsh-version }}
      - name: 全量测试(DSH ${{ matrix.dsh-version }})
        run: node --test tests/*.test.js
      - name: Bridge 补丁 dry-run(DSH ${{ matrix.dsh-version }})
        run: node scripts/ci-fake-dsh.mjs
      - name: 文档脱密检查
        run: node scripts/ci-doc-hygiene.mjs
      - name: README 单一真相检查
        run: node scripts/gen-package-readme.mjs --check

  # 真实补丁落盘 + doctor 冒烟:在 fake DSH 根里实际打一遍补丁并跑 self-heal,
  # 最后用 doctor 验证 deployment 状态。只在当前 DSH 默认版本上跑,控制成本。
  patch-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
      - name: 安装测试依赖
        run: npm install --no-package-lock --no-audit --no-fund
      - name: 实际补丁 + self-heal + doctor(fake DSH 根)
        run: node scripts/ci-fake-dsh.mjs --apply

  # 安装路径端到端冒烟:在临时 fake 部署根里真跑 install.sh / doctor / update.sh,
  # 验证「用户从 GitHub 下载仓库后一条命令装好 + 更新幂等」的完整路径。
  # 与 patch-smoke 互补:那个验证补丁本体,本 job 验证用户安装脚本。
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
      - name: 安装测试依赖(DSH 官方包 + devDependencies)
        run: npm install --no-package-lock --no-audit --no-fund
      - name: 安装/更新路径端到端冒烟(fake DSH 根)
        run: node scripts/ci-install-smoke.mjs
