name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: 安装测试依赖(DSH 官方包)
        run: npm install --no-package-lock
      - name: 全量测试(零第三方运行时依赖)
        run: node --test tests/*.test.js
      - name: README 单一真相检查
        run: node scripts/gen-package-readme.mjs --check
